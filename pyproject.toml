[project]
name = "rns-arithmetic"
version = "0.1.0"
description = "Educational notebooks on Booth recoding, RNS arithmetic, and 36-bit modular multiplication on commodity hardware."
readme = "README.md"
authors = [
    { name = "Hoseung", email = "chs51@kc-ml2.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
]

[project.optional-dependencies]
bench = [
    "torch>=2.11.0",
    "nvmath-python>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
